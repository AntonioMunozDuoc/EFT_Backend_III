spring.application.name=auth-server
server.port=9000

# ---------------------------------------------------------------------------
# Issuer FIJO: el claim "iss" de todos los tokens es este valor, sin importar
# desde que host se pida el token (localhost o red interna de Docker).
# Los resource servers validan contra este mismo valor.
# ---------------------------------------------------------------------------
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:9000}

# ---------------------------------------------------------------------------
# Clientes registrados - flujo client_credentials (servicio a servicio)
#
#  Canales (consumen un BFF)      : web-app | mobile-app | atm-app
#  BFFs (consumen microservicios) : bff-web | bff-mobile | bff-atm
#  Microservicios entre si        : cuentas-service -> clientes | pagos-service -> cuentas
#  Operacion                      : batch-operator (dispara los jobs de Spring Batch)
#
# Scopes de negocio (uno por microservicio, minimo privilegio):
#   clientes.access | cuentas.access | pagos.access | batch.access
#
# Secretos por variables de entorno (valores por defecto solo para desarrollo).
# {noop} = sin cifrado: SOLO ambiente academico.
# ---------------------------------------------------------------------------

spring.security.oauth2.authorizationserver.client.web-app.registration.client-id=web-app
spring.security.oauth2.authorizationserver.client.web-app.registration.client-secret={noop}${WEB_CLIENT_SECRET:web-secret-dev}
spring.security.oauth2.authorizationserver.client.web-app.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.web-app.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.web-app.registration.scopes[0]=web.access

spring.security.oauth2.authorizationserver.client.mobile-app.registration.client-id=mobile-app
spring.security.oauth2.authorizationserver.client.mobile-app.registration.client-secret={noop}${MOBILE_CLIENT_SECRET:mobile-secret-dev}
spring.security.oauth2.authorizationserver.client.mobile-app.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.mobile-app.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.mobile-app.registration.scopes[0]=mobile.access

spring.security.oauth2.authorizationserver.client.atm-app.registration.client-id=atm-app
spring.security.oauth2.authorizationserver.client.atm-app.registration.client-secret={noop}${ATM_CLIENT_SECRET:atm-secret-dev}
spring.security.oauth2.authorizationserver.client.atm-app.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.atm-app.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.atm-app.registration.scopes[0]=atm.access

spring.security.oauth2.authorizationserver.client.bff-web.registration.client-id=bff-web
spring.security.oauth2.authorizationserver.client.bff-web.registration.client-secret={noop}${BFF_WEB_SECRET:bff-web-secret-dev}
spring.security.oauth2.authorizationserver.client.bff-web.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-web.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.bff-web.registration.scopes[0]=cuentas.access
spring.security.oauth2.authorizationserver.client.bff-web.registration.scopes[1]=clientes.access
spring.security.oauth2.authorizationserver.client.bff-web.registration.scopes[2]=pagos.access

spring.security.oauth2.authorizationserver.client.bff-mobile.registration.client-id=bff-mobile
spring.security.oauth2.authorizationserver.client.bff-mobile.registration.client-secret={noop}${BFF_MOBILE_SECRET:bff-mobile-secret-dev}
spring.security.oauth2.authorizationserver.client.bff-mobile.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-mobile.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.bff-mobile.registration.scopes[0]=cuentas.access
spring.security.oauth2.authorizationserver.client.bff-mobile.registration.scopes[1]=clientes.access

spring.security.oauth2.authorizationserver.client.bff-atm.registration.client-id=bff-atm
spring.security.oauth2.authorizationserver.client.bff-atm.registration.client-secret={noop}${BFF_ATM_SECRET:bff-atm-secret-dev}
spring.security.oauth2.authorizationserver.client.bff-atm.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-atm.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.bff-atm.registration.scopes[0]=cuentas.access
