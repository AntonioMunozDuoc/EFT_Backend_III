spring.application.name=pagos-service

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8086}

# Base de datos PROPIA del microservicio (database-per-service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_pagos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Kafka (host dependiente del entorno; el resto vive en el Config Server)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# OAuth2 - Resource Server (scope pagos.access)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# OAuth2 - Cliente: identidad de pagos-service frente a cuentas-service
oauth2.client.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
oauth2.client.client-id=pagos-service
oauth2.client.client-secret=${PAGOS_SERVICE_SECRET:pagos-service-secret-dev}
oauth2.client.scope=cuentas.access

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
