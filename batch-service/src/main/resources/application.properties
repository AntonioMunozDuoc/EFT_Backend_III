spring.application.name=batch-service

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8087}

# Base de datos PROPIA (resultados + metadatos de Spring Batch)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Tablas de resultado (schema.sql) y metadatos del JobRepository
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.batch.jdbc.initialize-schema=always
# Los jobs NO se lanzan al arrancar: se disparan por API
spring.batch.job.enabled=false

batch.reports-dir=${BATCH_REPORTS_DIR:./reports}

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# OAuth2 - Resource Server (scope batch.access)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
