spring.application.name=cuentas-service

# Config Server (en Docker: CONFIG_SERVER_URL=http://config-server:8888)
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8084}

# Base de datos PROPIA del microservicio (database-per-service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_cuentas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datos iniciales (data.sql): solo si SQL_INIT_MODE=always (docker-compose)
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# Eureka: el servicio se registra con IP para poder escalar con varias replicas
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# OAuth2 - Resource Server (scope cuentas.access)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# OAuth2 - Cliente: identidad de cuentas-service frente a clientes-service
oauth2.client.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
oauth2.client.client-id=cuentas-service
oauth2.client.client-secret=${CUENTAS_SERVICE_SECRET:cuentas-service-secret-dev}
oauth2.client.scope=clientes.access

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
