spring.application.name=clientes-service

spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8085}

# Base de datos PROPIA del microservicio (database-per-service)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_clientes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# OAuth2 - Resource Server (scope clientes.access)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
