# =============================================================================
# pagos-service - configuracion centralizada (Spring Cloud Config)
# =============================================================================
banco.xyz.config.origen=Config Server EFT Semana 9 (pagos-service)

# Regla de negocio: monto desde el cual se emite una alerta de seguridad
pagos.alerta.monto-umbral=1000000

# ---- Kafka: productor ----
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Topicos
banco.kafka.topic.movimientos=banco.movimientos
banco.kafka.topic.alertas=banco.alertas

# ---- Llamadas a cuentas-service: timeouts, Retry y Bulkhead ----
cuentas.api.base-url=http://cuentas-service
cuentas.api.connect-timeout-ms=2000
cuentas.api.read-timeout-ms=3000
resilience.retry.max-attempts=3
resilience.retry.wait-ms=300
resilience.bulkhead.max-concurrent-calls=10
resilience.bulkhead.max-wait-ms=100

# ---- Resilience4j ----
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Circuit Breaker hacia cuentas-service (errores funcionales NO abren el circuito)
resilience4j.circuitbreaker.instances.cuentasApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.cuentasApi.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.cuentasApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cuentasApi.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentasApi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentasApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentasApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentasApi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.cuentasApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.cuentasApi.ignore-exceptions=com.bancoxyz.pagos.exception.PagoRechazadoException,com.bancoxyz.pagos.exception.RecursoNoEncontradoException,org.springframework.web.client.HttpClientErrorException

# Circuit Breaker de publicacion en Kafka (continuidad operativa si Kafka cae)
resilience4j.circuitbreaker.instances.kafkaPublisher.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublisher.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.kafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublisher.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.kafkaPublisher.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaPublisher.automatic-transition-from-open-to-half-open-enabled=true
