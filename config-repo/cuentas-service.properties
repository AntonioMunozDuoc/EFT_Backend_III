# =============================================================================
# cuentas-service - configuracion centralizada (Spring Cloud Config)
# =============================================================================
banco.xyz.config.origen=Config Server EFT Semana 9 (cuentas-service)

# ---- Llamadas a clientes-service: timeouts, Retry y Bulkhead ----
clientes.api.base-url=http://clientes-service
clientes.api.connect-timeout-ms=2000
clientes.api.read-timeout-ms=3000
resilience.retry.max-attempts=3
resilience.retry.wait-ms=300
resilience.bulkhead.max-concurrent-calls=10
resilience.bulkhead.max-wait-ms=100

spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# Circuit Breaker hacia clientes-service
resilience4j.circuitbreaker.instances.clientesApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.clientesApi.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.clientesApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.clientesApi.sliding-window-size=5
resilience4j.circuitbreaker.instances.clientesApi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.clientesApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.clientesApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clientesApi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.clientesApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.clientesApi.ignore-exceptions=com.bancoxyz.cuentas.exception.ClienteInvalidoException,org.springframework.web.client.HttpClientErrorException
