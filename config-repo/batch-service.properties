# =============================================================================
# batch-service - configuracion centralizada (Spring Cloud Config)
# =============================================================================
banco.xyz.config.origen=Config Server EFT Semana 9 (batch-service)

# Rendimiento
batch.chunk-size=100
batch.concurrencia=4

# Politica de finalizacion: maximo de registros invalidos tolerados por step.
# Si se supera, el step falla (el legacy semana_3 tiene ~40-50% de registros con problemas).
batch.skip-limit=700

# Politica de reejecucion automatica ante fallos criticos (restart del mismo job)
batch.reejecucion.max-intentos=3
batch.reejecucion.espera-ms=2000
